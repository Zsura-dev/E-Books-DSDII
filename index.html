line-height:1.5}.card{background:white;border:1px solid #dce6ef;border-radius:17px;padding:19px 17px;margin:14px 0;box-shadow:0 3px 14px #163b5b09}.card h2,.card h3{margin-top:0}.card p{line-height:1.65}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#1c567d;color:white;border:1px solid #1c567d;border-radius:11px;padding:12px 15px;min-height:47px;font-weight:700;text-align:center}.btn.secondary{background:white;color:#1c567d;border-color:#b8cddc}.btn.soft{background:#e8f2f7;color:#19425f;border-color:#e8f2f7}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.wide{width:100%}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.back{margin-bottom:12px}.tag{display:inline-block;border-radius:50px;padding:5px 10px;background:#e9f1f6;color:#355c75;font-size:.75rem;font-weight:700}.summary{background:#eff7f5;border-left:4px solid #4c998a;padding:12px 14px;border-radius:9px;line-height:1.6}.lead{font-size:1.05rem;line-height:1.7}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.word{border:1px solid #dce7ef;border-radius:13px;padding:13px;margin:10px 0;background:#fbfdff}.word strong{display:block;font-size:1.02rem;margin-bottom:5px}.word .def{color:#456278;line-height:1.55}.word .hu{color:#6b407d;margin-top:8px;font-weight:650}.sentence{padding:13px;border-left:3px solid #91b5ca;background:#f6f9fc;border-radius:7px;margin:10px 0;line-height:1.6}.sentence small{display:block;color:#6b407d;margin-top:6px}.qcard{border:1px solid #dbe6ef;padding:16px;border-radius:13px;margin:12px 0}.qcard p{margin-top:6px}.answer{background:#f1f8f3;border-radius:10px;padding:13px;line-height:1.65;margin-top:10px}.choice{display:block;width:100%;border:1px solid #cbdbe6;border-radius:10px;background:white;padding:12px;text-align:left;margin:9px 0;min-height:46px}.choice.selected{border-color:#1c567d;background:#e9f3f8}.choice.correct{border-color:#388466;background:#e9f8ef}.choice.wrong{border-color:#c16c61;background:#fff0ed}.feedback{padding:12px;border-radius:10px;background:#e9f8ef;margin-top:12px;line-height:1.55}.feedback.error{background:#fff1ec}.small{font-size:.85rem;color:#557084}.progress{height:9px;background:#dce8f0;border-radius:10px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#438b7d}.search{width:100%;border:1px solid #b9cbd8;border-radius:11px;padding:13px;min-height:48px;background:white}.filter{width:100%;padding:12px;border:1px solid #b9cbd8;border-radius:11px;background:white}.footer{padding:25px 15px;text-align:center;color:#637a8c;font-size:.75rem;line-height:1.7}.link{border:0;background:transparent;color:#1c567d;text-decoration:underline;padding:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e5edf2}.checkrow input{width:22px;height:22px;flex:none}.divider{height:1px;background:#e4edf3;margin:18px 0}.number{font-weight:800;color:#3b718d;font-size:.8rem}.info{background:#fff8e8;border:1px solid #f0d9a6;padding:12px;border-radius:10px;line-height:1.6}.pillbar{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:8px 10px;border:1px solid #bdd2df;background:white;color:#234d6a;border-radius:50px;font-size:.8rem}.pill.active{background:#1c567d;color:white}.fixedbottom{position:sticky;bottom:0;background:#f3f6faeb;padding:10px 0;backdrop-filter:blur(7px)}.stat{font-size:.85rem;color:#486b7d}.empty{padding:20px;color:#667f8f;text-align:center}@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding:28px 24px 70px}.hero{padding:35px}.hero h1{font-size:2.15rem}.two-col{grid-template-columns:1fr 1fr}}@media(max-width:370px){.level{font-size:.65rem}.grid{gap:8px}.tile{padding:12px 10px;min-height:110px}.tile strong{font-size:.9rem}.shell{padding:14px 10px 55px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

</style></head><body><header class="top"><div class="head-inner"><button id="homeBtn" class="brand" aria-label="Zur Startseite">📚 <span>E-Books Lernkurs</span></button><span class="level">DSD II · B2/C1</span></div></header><main id="app" class="shell" aria-live="polite"></main><footer class="footer">DSD II · Selbstständig lernen · <button class="link" onclick="go('home')">🏠 Zur Startseite</button></footer><script>const CONTENT = {"modules":[{"id":0,"title":"Grundwissen","hu":"Alapismeretek","text":"Ein E-Book ist ein Buch in digitaler Form. Man liest es auf einem E-Book-Reader, Tablet, Smartphone oder Computer. Spezielle E-Book-Reader verwenden oft E-Ink-Displays, die Papier ähneln. Digitale Bücher gibt es in unterschiedlichen Dateiformaten, zum Beispiel EPUB und PDF. Nicht jedes Format funktioniert auf jedem Gerät.","summary":"Az e-könyv digitális könyv; az eszköz és a fájlformátum nem ugyanaz.","vocab":[{"de":"das E-Book","definition":"ein Buch in digitaler Form","hu":"e-könyv"},{"de":"der E-Book-Reader","definition":"ein Gerät zum Lesen digitaler Bücher","hu":"e-könyv-olvasó"},{"de":"das E-Ink-Display","definition":"ein Bildschirm, der Papier ähnlich sieht","hu":"elektronikus papírkijelző"},{"de":"das Dateiformat","definition":"die technische Form einer digitalen Datei","hu":"fájlformátum"},{"de":"kompatibel sein mit + D","definition":"mit einem Gerät zusammen funktionieren","hu":"kompatibilis valamivel"},{"de":"die Bildschirmauflösung","definition":"die Anzahl der Bildpunkte auf einem Bildschirm","hu":"képernyőfelbontás"},{"de":"die Akkulaufzeit","definition":"die Zeit, die ein Akku ohne Laden funktioniert","hu":"akkumulátor-üzemidő"}],"sentences":["E-Books sind Bücher in digitaler Form, die man auf verschiedenen Geräten lesen kann.","Im Gegensatz zu einem Tablet ist ein E-Book-Reader hauptsächlich zum Lesen gedacht.","Nicht jedes Dateiformat ist mit jedem Lesegerät kompatibel."],"questions":[{"q":"Was ist der Unterschied zwischen einem E-Book und einem E-Book-Reader?","a":"Ein E-Book ist eine digitale Datei mit einem Buch. Ein E-Book-Reader ist dagegen das Gerät, auf dem man diese Datei lesen kann."},{"q":"Welche Geräte eignen sich zum Lesen von E-Books?","a":"Man kann E-Books auf speziellen Lesegeräten, Tablets, Smartphones oder Computern lesen. Ein E-Book-Reader ist häufig besonders angenehm für längere Texte."},{"q":"Welche Unterschiede gibt es zwischen einem E-Book und einem gedruckten Buch?","a":"Ein E-Book ist eine digitale Datei, während ein gedrucktes Buch aus Papier besteht. Ein digitales Buch kann man auf verschiedenen Geräten lesen. Gedruckte Bücher brauchen dagegen weder Strom noch ein Lesegerät."},{"q":"Welche technischen Eigenschaften sind beim Kauf eines E-Book-Readers wichtig?","a":"Wichtig sind für mich die Akkulaufzeit, das Display, die Speicherkapazität und die unterstützten Dateiformate. Außerdem sollte das Gerät leicht sein und eine gut einstellbare Schriftgröße haben."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":1,"title":"Möglichkeiten und Funktionen","hu":"Lehetőségek és funkciók","text":"Mit einem E-Book-Reader kann man viele Bücher speichern, herunterladen und lesen. Häufig lassen sich Schriftgröße, Schriftart und Beleuchtung einstellen. Man kann Textstellen markieren, Lesezeichen setzen, Notizen machen und unbekannte Wörter nachschlagen. Einige Geräte synchronisieren den Lesefortschritt. Viele heruntergeladene Bücher kann man auch offline lesen. Die genauen Funktionen hängen vom Gerät und vom Buchformat ab.","summary":"Letöltés, tárolás, keresés, kijelölés, jegyzetelés és beállítások – nem minden eszközön egyformán.","vocab":[{"de":"herunterladen","definition":"eine Datei aus dem Internet auf ein Gerät übertragen","hu":"letölteni"},{"de":"speichern","definition":"digital aufbewahren","hu":"tárolni, menteni"},{"de":"die Schriftgröße anpassen","definition":"die Buchstaben größer oder kleiner machen","hu":"betűméretet módosítani"},{"de":"die Helligkeit einstellen","definition":"die Stärke des Lichts verändern","hu":"fényerőt beállítani"},{"de":"eine Textstelle markieren","definition":"einen Teil des Textes hervorheben","hu":"szövegrészt kijelölni"},{"de":"ein Lesezeichen setzen","definition":"eine Stelle im Buch für später merken","hu":"könyvjelzőt elhelyezni"},{"de":"ein Wort nachschlagen","definition":"die Bedeutung eines Wortes suchen","hu":"szót kikeresni"},{"de":"Notizen machen","definition":"kurze Gedanken aufschreiben","hu":"jegyzetelni"},{"de":"den Lesefortschritt synchronisieren","definition":"den aktuellen Lesestand auf mehreren Geräten abgleichen","hu":"olvasási előrehaladást szinkronizálni"},{"de":"offline lesen","definition":"ohne Internetverbindung lesen","hu":"internet nélkül olvasni"},{"de":"den Akku aufladen","definition":"dem Gerät wieder Energie geben","hu":"akkumulátort feltölteni"}],"sentences":["Besonders praktisch finde ich, dass man unbekannte Wörter sofort nachschlagen kann.","Dank der Suchfunktion findet man bestimmte Informationen schnell wieder.","Ein großer Vorteil besteht darin, dass man zahlreiche Bücher auf einem Gerät speichern kann."],"questions":[{"q":"Welche Funktionen findest du besonders nützlich?","a":"Für mich ist die Wörterbuchfunktion besonders nützlich, weil ich beim Lesen schnell unbekannte Wörter nachschlagen kann. Außerdem kann ich wichtige Stellen markieren."},{"q":"Welche Grenzen haben diese Funktionen?","a":"Nicht alle Geräte bieten dieselben Funktionen. Außerdem muss man den Akku aufladen, und manche Bücher sind durch technische Beschränkungen geschützt."},{"q":"Welche Funktionen eines E-Book-Readers erleichtern das Lernen?","a":"Besonders hilfreich finde ich die Suchfunktion, das digitale Wörterbuch und die Möglichkeit, Textstellen zu markieren. So kann man wichtige Informationen schneller wiederfinden und unbekannte Wörter sofort nachschlagen."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":2,"title":"Kosten","hu":"Költségek","text":"Ein E-Book-Reader kostet zunächst Geld. Ob sich die Anschaffung lohnt, hängt davon ab, wie oft man liest und welche Bücher man kauft. Manche E-Books sind günstiger als gedruckte Ausgaben, andere nicht. Bibliotheken bieten teilweise kostenlose digitale Ausleihe für ihre Mitglieder an. Bei einem Preisvergleich sollte man auch Abonnements und mögliche Zusatzkosten berücksichtigen.","summary":"A megtérülés az olvasási szokásoktól, a könyváraktól és az előfizetésektől függ.","vocab":[{"de":"die Anschaffungskosten (Pl.)","definition":"das Geld für den Kauf eines Geräts","hu":"beszerzési költségek"},{"de":"sich lohnen","definition":"einen Nutzen bringen, sinnvoll sein","hu":"megérni"},{"de":"auf Dauer","definition":"über einen längeren Zeitraum","hu":"hosszú távon"},{"de":"Geld sparen","definition":"weniger Geld ausgeben","hu":"pénzt megtakarítani"},{"de":"die Leihgebühr","definition":"das Geld für eine Ausleihe","hu":"kölcsönzési díj"},{"de":"das Abonnement","definition":"regelmäßige Zahlung für ein Angebot","hu":"előfizetés"},{"de":"das Preis-Leistungs-Verhältnis","definition":"das Verhältnis von Preis und Nutzen","hu":"ár-érték arány"},{"de":"kostenpflichtig","definition":"nicht kostenlos","hu":"fizetős"}],"sentences":["Ein E-Book-Reader ist in der Anschaffung nicht kostenlos.","Ob man auf Dauer Geld spart, hängt davon ab, wie viele Bücher man liest.","Man darf nicht vergessen, dass digitale Bücher ebenfalls Geld kosten können."],"questions":[{"q":"Sind E-Books günstiger als gedruckte Bücher?","a":"Das lässt sich nicht allgemein sagen. Manche digitale Ausgaben sind günstiger, aber zuerst muss man ein Gerät kaufen. Entscheidend ist, wie häufig man liest."},{"q":"Würdest du für ein E-Book-Abonnement bezahlen?","a":"Ich würde dafür bezahlen, wenn die Auswahl groß ist und ich regelmäßig lese. Sonst wäre die Ausleihe in einer Bibliothek für mich sinnvoller."},{"q":"Wann lohnt sich die Anschaffung eines E-Book-Readers?","a":"Die Anschaffung kann sich lohnen, wenn man häufig liest und viele Bücher unterwegs mitnehmen möchte. Ob man tatsächlich Geld spart, hängt allerdings von den Buchpreisen und den eigenen Lesegewohnheiten ab."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":3,"title":"Angebot und Zugang","hu":"Kínálat és hozzáférés","text":"Im Internet gibt es ein großes Angebot an E-Books: Romane, Sachbücher, Fachliteratur und fremdsprachige Titel. Man kann Bücher kaufen oder über digitale Bibliotheken ausleihen. Allerdings ist nicht jedes Buch als E-Book erhältlich. Außerdem können Dateiformate, regionale Rechte oder Kopierschutz den Zugang einschränken. Deshalb sollte man vor dem Kauf prüfen, ob ein Titel auf dem eigenen Gerät funktioniert.","summary":"Nagy a választék, de az elérhetőséget formátumok és jogi korlátozások befolyásolhatják.","vocab":[{"de":"das Angebot","definition":"die Auswahl an Produkten","hu":"kínálat"},{"de":"erhältlich sein","definition":"gekauft oder genutzt werden können","hu":"kapható, elérhető"},{"de":"die Auswahl","definition":"verschiedene Möglichkeiten, aus denen man wählen kann","hu":"választék"},{"de":"der Zugang zu + D","definition":"die Möglichkeit, etwas zu nutzen","hu":"hozzáférés valamihez"},{"de":"die Ausleihe","definition":"das zeitlich begrenzte Nutzen geliehener Medien","hu":"kölcsönzés"},{"de":"einschränken","definition":"kleiner machen, begrenzen","hu":"korlátozni"},{"de":"die Fachliteratur","definition":"Bücher zu einem bestimmten Fachgebiet","hu":"szakirodalom"}],"sentences":["Das digitale Angebot ist groß, aber nicht jeder Titel ist erhältlich.","Vor dem Kauf sollte man prüfen, ob das Dateiformat zum eigenen Gerät passt.","Öffentliche Bibliotheken ermöglichen vielen Menschen den Zugang zu digitalen Büchern."],"questions":[{"q":"Welche Bücher kann man als E-Books finden?","a":"Es gibt viele Romane, Sachbücher und Fachbücher. Allerdings sind nicht alle Titel digital erhältlich."},{"q":"Welche Probleme kann es beim Zugang geben?","a":"Manchmal ist ein bestimmter Titel nicht als E-Book verfügbar. Außerdem können Dateiformate, Kopierschutz oder die Bedingungen einer Leihlizenz den Zugang einschränken. Deshalb sollte man vor dem Kauf die Nutzungsbedingungen prüfen."},{"q":"Welche Möglichkeiten bieten digitale Bibliotheken?","a":"Digitale Bibliotheken ermöglichen es, E-Books für eine begrenzte Zeit auszuleihen. Das ist besonders praktisch, weil man nicht persönlich in die Bibliothek gehen muss. Allerdings sind nicht immer alle Titel sofort verfügbar."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":4,"title":"Printmedien","hu":"Nyomtatott könyvek","text":"Gedruckte Bücher haben trotz der Digitalisierung viele Anhänger. Man kann in ihnen blättern, sie verleihen und ins Regal stellen. Viele Menschen schätzen das Gefühl von Papier und den Geruch eines Buches. Ein gedrucktes Buch braucht keinen Akku. Allerdings benötigt es Platz und kann auf Reisen schwer sein. Digitale und gedruckte Bücher müssen sich deshalb nicht gegenseitig ersetzen.","summary":"A nyomtatott könyveknek kézzelfogható előnyeik vannak; a két forma együtt is létezhet.","vocab":[{"de":"das Printmedium","definition":"ein gedrucktes Informationsmittel","hu":"nyomtatott médium"},{"de":"das gedruckte Buch","definition":"ein Buch auf Papier","hu":"nyomtatott könyv"},{"de":"in einem Buch blättern","definition":"die Seiten nacheinander umdrehen","hu":"könyvben lapozni"},{"de":"das Bücherregal","definition":"ein Regal für Bücher","hu":"könyvespolc"},{"de":"das Leseerlebnis","definition":"das persönliche Gefühl beim Lesen","hu":"olvasási élmény"},{"de":"etwas ersetzen","definition":"an die Stelle von etwas treten","hu":"helyettesíteni valamit"},{"de":"nebeneinander bestehen","definition":"gleichzeitig existieren","hu":"egymás mellett létezni"}],"sentences":["Viele Leser schätzen das besondere Gefühl, ein gedrucktes Buch in der Hand zu halten.","Im Gegensatz zu E-Book-Readern brauchen gedruckte Bücher keinen Strom.","Meiner Meinung nach können beide Buchformen nebeneinander bestehen."],"questions":[{"q":"Warum bevorzugen manche Menschen Printmedien?","a":"Viele Menschen mögen das Gefühl von Papier und das Blättern. Außerdem braucht man zum Lesen keinen Akku."},{"q":"Können E-Books gedruckte Bücher vollständig ersetzen?","a":"Ich glaube nicht, dass sie gedruckte Bücher vollständig ersetzen. Beide Formen haben eigene Vorteile und sprechen unterschiedliche Bedürfnisse an."},{"q":"Warum schätzen viele Menschen gedruckte Bücher weiterhin?","a":"Viele Menschen mögen es, Seiten umzublättern und ein Buch in der Hand zu halten. Außerdem verbinden sie gedruckte Bücher mit Ruhe und Konzentration. Deshalb werden Printmedien meiner Meinung nach nicht vollständig verschwinden."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":5,"title":"Lesegewohnheiten","hu":"Olvasási szokások","text":"Die Digitalisierung verändert, wann, wo und wie Menschen lesen. Mit dem Smartphone kann man unterwegs kurze Texte lesen, während manche Menschen für längere Bücher einen E-Book-Reader bevorzugen. Andere greifen lieber zu gedruckten Büchern. Ob jemand regelmäßig liest, hängt nicht nur vom Medium ab, sondern auch von Zeit, Interesse und Gewohnheiten.","summary":"A médium hat a szokásokra, de az olvasási kedv nem csak az eszköztől függ.","vocab":[{"de":"die Lesegewohnheit","definition":"die Art, wie jemand regelmäßig liest","hu":"olvasási szokás"},{"de":"das Leseverhalten","definition":"die Art und Häufigkeit des Lesens","hu":"olvasási magatartás"},{"de":"unterwegs","definition":"nicht zu Hause, auf dem Weg","hu":"útközben"},{"de":"bevorzugen","definition":"lieber wählen","hu":"előnyben részesíteni"},{"de":"regelmäßig","definition":"immer wieder","hu":"rendszeresen"},{"de":"sich verändern","definition":"anders werden","hu":"megváltozni"},{"de":"die Aufmerksamkeitsspanne","definition":"die Zeit, in der man konzentriert bleiben kann","hu":"figyelmi időtartam"}],"sentences":["Durch die Digitalisierung haben sich die Lesegewohnheiten verändert.","Welche Leseform man bevorzugt, hängt von den persönlichen Gewohnheiten ab.","Nicht das Medium allein entscheidet darüber, ob Menschen gern lesen."],"questions":[{"q":"Wie haben sich die Lesegewohnheiten verändert?","a":"Viele Menschen lesen heute auch auf digitalen Geräten, besonders unterwegs. Trotzdem spielen gedruckte Bücher weiterhin eine wichtige Rolle."},{"q":"Liest du digital anders als auf Papier?","a":"Ja, beim digitalen Lesen suche ich oft gezielt nach Informationen. Bei einem gedruckten Roman lese ich dagegen meistens länger am Stück. Das hängt aber auch vom Gerät und von der Textsorte ab."},{"q":"Wie beeinflussen Smartphones und E-Books das Leseverhalten junger Menschen?","a":"Digitale Geräte machen Texte schnell zugänglich. Gleichzeitig können Nachrichten und Apps die Aufmerksamkeit unterbrechen. Deshalb kommt es darauf an, welches Gerät man benutzt und wie bewusst man liest."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":6,"title":"Copyright und Datenschutz","hu":"Szerzői jog és adatvédelem","text":"E-Books sind urheberrechtlich geschützte Werke. Man darf sie nicht automatisch beliebig kopieren oder im Internet verbreiten. Manche Anbieter verwenden einen digitalen Kopierschutz, auch DRM genannt. Er kann die Nutzung oder Weitergabe einschränken. Bei digitalen Diensten spielt außerdem der Datenschutz eine Rolle, weil Nutzungsdaten gespeichert werden können.","summary":"A digitális könyvek szerzői jogi védelem alatt állnak; a másolás és az adatkezelés fontos kérdés.","vocab":[{"de":"das Urheberrecht","definition":"das Recht, das Werke von Autoren schützt","hu":"szerzői jog"},{"de":"das geistige Eigentum","definition":"Ideen und Werke, die rechtlich geschützt sein können","hu":"szellemi tulajdon"},{"de":"die Urheberrechtsverletzung","definition":"ein Verstoß gegen das Urheberrecht","hu":"szerzői jog megsértése"},{"de":"illegal herunterladen","definition":"ohne die nötige Erlaubnis herunterladen","hu":"illegálisan letölteni"},{"de":"der Kopierschutz","definition":"eine technische Einschränkung des Kopierens","hu":"másolásvédelem"},{"de":"das DRM","definition":"technische Verwaltung digitaler Nutzungsrechte","hu":"digitális jogkezelés"},{"de":"der Datenschutz","definition":"der Schutz persönlicher Daten","hu":"adatvédelem"},{"de":"die Nutzungsdaten (Pl.)","definition":"Informationen darüber, wie ein Dienst benutzt wird","hu":"használati adatok"}],"sentences":["Nicht alles, was technisch möglich ist, ist auch rechtlich erlaubt.","Der Kopierschutz kann die Weitergabe digitaler Bücher einschränken.","Beim digitalen Lesen sollte man auch den Schutz persönlicher Daten berücksichtigen."],"questions":[{"q":"Welche Nachteile kann ein Kopierschutz haben?","a":"Er kann die Nutzung auf bestimmten Geräten einschränken. Für Leser ist das manchmal unpraktisch, obwohl sie das Buch legal erworben haben."},{"q":"Warum ist der Schutz des Urheberrechts bei E-Books wichtig?","a":"Autoren und Verlage investieren Zeit und Geld in Bücher. Wenn digitale Kopien illegal verbreitet werden, können ihnen Einnahmen entgehen. Deshalb sollte man E-Books nur aus legalen Quellen beziehen."}],"c1":["die Rechte der Urheber wahren (megóvni a szerzők jogait)","Die Nutzungsrechte sind nicht mit dem Eigentum am Gerät gleichzusetzen. (A felhasználási jogok nem azonosak az eszköz tulajdonjogával.)"]},{"id":7,"title":"Literatur und Film","hu":"Irodalom és film","text":"Viele bekannte Filme basieren auf Romanen. Ein Buch enthält oft mehr Einzelheiten, während ein Film Bilder, Musik und Schauspiel verbindet. Beim Lesen entwickelt man eigene Vorstellungen von Figuren und Schauplätzen. Eine Verfilmung kann dagegen eine Geschichte in kurzer Zeit anschaulich erzählen. E-Books erleichtern den Zugang zu literarischen Vorlagen, die man anschließend mit Filmen vergleichen kann.","summary":"A könyv és a film eltérő élményt nyújt; jó összehasonlítási lehetőség.","vocab":[{"de":"die Verfilmung","definition":"ein Film nach einem Buch","hu":"filmfeldolgozás"},{"de":"die literarische Vorlage","definition":"das Buch, auf dem ein Film basiert","hu":"irodalmi alapmű"},{"de":"die Handlung","definition":"das, was in einer Geschichte passiert","hu":"cselekmény"},{"de":"die Figur","definition":"eine Person in einer Geschichte","hu":"szereplő"},{"de":"der Schauplatz","definition":"der Ort der Handlung","hu":"helyszín"},{"de":"die Vorstellungskraft","definition":"die Fähigkeit, sich Dinge vorzustellen","hu":"képzelőerő"},{"de":"anschaulich","definition":"leicht vorstellbar, bildhaft","hu":"szemléletes"}],"sentences":["Beim Lesen entwickelt man eigene Vorstellungen von den Figuren.","Im Vergleich zum Film enthält ein Roman oft mehr Einzelheiten.","Eine Verfilmung kann Interesse an der literarischen Vorlage wecken."],"questions":[{"q":"Liest du lieber das Buch oder siehst du die Verfilmung?","a":"Ich lese lieber zuerst das Buch, weil ich mir die Figuren selbst vorstellen kann. Danach finde ich es interessant, die Verfilmung zu vergleichen."},{"q":"Können Filme zum Lesen motivieren?","a":"Ja, eine gelungene Verfilmung kann neugierig auf die literarische Vorlage machen. Manche Zuschauer möchten anschließend mehr über die Geschichte erfahren."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":8,"title":"Umwelt und Nachhaltigkeit","hu":"Környezet és fenntarthatóság","text":"Für gedruckte Bücher benötigt man Papier, Wasser, Energie und Transport. Für E-Book-Reader braucht man dagegen Rohstoffe und Energie bei der Herstellung. Später entsteht möglicherweise Elektroschrott. Deshalb lässt sich nicht pauschal sagen, welche Buchform umweltfreundlicher ist. Entscheidend sind unter anderem die Nutzungsdauer des Geräts und die Anzahl der gelesenen Bücher.","summary":"A környezeti hatás több tényezőtől függ; nem igaz automatikusan, hogy az e-book zöldebb.","vocab":[{"de":"die Nachhaltigkeit","definition":"der verantwortungsvolle Umgang mit Ressourcen","hu":"fenntarthatóság"},{"de":"die Umweltbelastung","definition":"eine schädliche Wirkung auf die Umwelt","hu":"környezeti terhelés"},{"de":"der Rohstoff","definition":"ein Material aus der Natur für die Produktion","hu":"nyersanyag"},{"de":"die Herstellung","definition":"die Produktion","hu":"előállítás, gyártás"},{"de":"der Elektroschrott","definition":"alte oder kaputte elektronische Geräte","hu":"elektronikai hulladék"},{"de":"die Nutzungsdauer","definition":"die Zeit, in der etwas benutzt wird","hu":"használati időtartam"},{"de":"die Umweltbilanz","definition":"die gesamten Umweltwirkungen eines Produkts","hu":"környezeti mérleg"}],"sentences":["Ob E-Books umweltfreundlicher sind, lässt sich nicht pauschal beantworten.","Für die Herstellung eines Lesegeräts werden Rohstoffe und Energie benötigt.","Entscheidend ist, wie lange man das Gerät tatsächlich verwendet."],"questions":[{"q":"Sind E-Books umweltfreundlicher?","a":"Das hängt von mehreren Faktoren ab. E-Books sparen Papier und Transport, aber für die Geräte braucht man Rohstoffe und Energie. Deshalb kommt es auch auf die Nutzungsdauer an."},{"q":"Wie kann man beim Lesen die Umwelt schonen?","a":"Man kann Bücher ausleihen, Geräte lange nutzen und funktionierende Geräte nicht unnötig ersetzen. Auch gebrauchte Bücher sind eine Möglichkeit."},{"q":"Welche Faktoren muss man bei der Umweltbilanz berücksichtigen?","a":"Man sollte die Herstellung, den Energieverbrauch, die Nutzungsdauer und die Entsorgung vergleichen. Ein Lesegerät benötigt Rohstoffe, kann aber viele gedruckte Bücher ersetzen. Deshalb ist eine pauschale Antwort schwierig."}],"c1":["die gesamte Ökobilanz berücksichtigen (a teljes ökológiai mérleget figyelembe venni)","Es kommt maßgeblich auf die Nutzungsdauer an. (Ez nagymértékben a használati időtől függ.)"]},{"id":9,"title":"Schule und Bildung","hu":"Iskola és oktatás","text":"Digitale Schulbücher können den Schulalltag erleichtern. Schüler müssen weniger schwere Bücher tragen und können Texte durchsuchen oder markieren. Manche Lernmaterialien bieten interaktive Aufgaben und Hörtexte. Allerdings brauchen alle Lernenden geeignete Geräte und möglichst einen verlässlichen Zugang. Außerdem müssen Schulen darauf achten, dass digitale Medien das Lernen unterstützen und nicht ablenken.","summary":"A digitális tankönyvek hasznosak lehetnek, de hozzáférés és pedagógiai cél is kell.","vocab":[{"de":"das digitale Schulbuch","definition":"ein Schulbuch in elektronischer Form","hu":"digitális tankönyv"},{"de":"das Lernmaterial","definition":"Material zum Lernen","hu":"tananyag"},{"de":"die Lernplattform","definition":"ein digitaler Ort für Lerninhalte","hu":"tanulási platform"},{"de":"interaktiv","definition":"mit aktiver Beteiligung","hu":"interaktív"},{"de":"der gleichberechtigte Zugang","definition":"eine faire Möglichkeit für alle, etwas zu nutzen","hu":"egyenlő hozzáférés"},{"de":"ablenken von + D","definition":"die Aufmerksamkeit von etwas weglenken","hu":"elvonni a figyelmet valamiről"},{"de":"gezielt einsetzen","definition":"bewusst für einen bestimmten Zweck nutzen","hu":"célzottan alkalmazni"}],"sentences":["Digitale Schulbücher können den Unterricht sinnvoll ergänzen.","Ein Problem besteht darin, dass nicht alle Schüler die gleichen technischen Möglichkeiten haben.","Technik sollte das Lernen unterstützen und nicht zum Selbstzweck werden."],"questions":[{"q":"Sollten Schulen vollständig digitale Schulbücher verwenden?","a":"Ich würde eine Kombination bevorzugen. Digitale Materialien sind praktisch, aber gedruckte Bücher können für konzentriertes Lesen sinnvoll sein."},{"q":"Welche Voraussetzungen braucht digitales Lernen?","a":"Alle Schüler brauchen geeignete Geräte und Zugang zu den Materialien. Außerdem müssen Lehrkräfte und Schüler wissen, wie man die Technik sinnvoll nutzt."},{"q":"Welche Probleme können digitale Schulbücher im Unterricht verursachen?","a":"Nicht alle Schüler haben geeignete Geräte oder eine stabile Internetverbindung. Außerdem können digitale Geräte ablenken. Deshalb sollten Schulen technische Voraussetzungen schaffen und klare Regeln vereinbaren."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":10,"title":"Gesundheit und Konzentration","hu":"Egészség és koncentráció","text":"Langes Lesen kann anstrengend sein, besonders bei ungünstiger Beleuchtung oder schlechter Körperhaltung. Auf Smartphones und Tablets können Nachrichten die Aufmerksamkeit stören. Ein spezieller E-Book-Reader hat oft ein E-Ink-Display und weniger Ablenkungsmöglichkeiten. Regelmäßige Pausen und passende Einstellungen können das Lesen angenehmer machen. Die Wirkung hängt auch von der Person und dem Gerät ab.","summary":"A kijelző típusa, a fényviszonyok és az értesítések hatnak az olvasási élményre.","vocab":[{"de":"die Konzentration","definition":"die Fähigkeit, aufmerksam zu bleiben","hu":"koncentráció"},{"de":"die Ablenkung","definition":"etwas, das die Aufmerksamkeit stört","hu":"figyelemelterelés"},{"de":"die Augenbelastung","definition":"Anstrengung für die Augen","hu":"szemterhelés"},{"de":"die Beleuchtung","definition":"das Licht beim Lesen","hu":"megvilágítás"},{"de":"die Körperhaltung","definition":"die Position des Körpers","hu":"testtartás"},{"de":"die Benachrichtigung","definition":"eine Meldung auf dem Gerät","hu":"értesítés"},{"de":"eine Pause einlegen","definition":"für kurze Zeit aufhören","hu":"szünetet tartani"}],"sentences":["Benachrichtigungen können die Konzentration beim Lesen stören.","Ein E-Ink-Display kann für längeres Lesen angenehmer sein.","Regelmäßige Pausen helfen dabei, Belastungen zu reduzieren."],"questions":[{"q":"Was stört die Konzentration beim digitalen Lesen?","a":"Auf einem Smartphone lenken Nachrichten und Apps leicht ab. Deshalb kann ein spezieller E-Book-Reader für längere Texte praktischer sein."},{"q":"Wie kann man gesund digital lesen?","a":"Man sollte auf gutes Licht und eine angenehme Körperhaltung achten. Außerdem sind Pausen sinnvoll und Benachrichtigungen können ausgeschaltet werden."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":11,"title":"Wirtschaft und Buchhandel","hu":"Gazdaság és könyvkereskedelem","text":"Die Digitalisierung verändert den Buchmarkt. Verlage veröffentlichen Bücher in gedruckter und digitaler Form. Online-Plattformen erleichtern den Verkauf, während traditionelle Buchhandlungen neue Angebote entwickeln müssen. Autoren, Verlage und Händler sollen für ihre Arbeit angemessen bezahlt werden. Digitale Bücher verursachen zwar keine Druckkosten, aber zum Beispiel Kosten für Redaktion, Gestaltung und Vertrieb.","summary":"A digitális könyvpiac üzleti lehetőség és kihívás is; a digitális könyv előállítása sem ingyenes.","vocab":[{"de":"der Buchmarkt","definition":"der Markt für Bücher","hu":"könyvpiac"},{"de":"der Verlag","definition":"ein Unternehmen, das Bücher veröffentlicht","hu":"könyvkiadó"},{"de":"der Buchhandel","definition":"der Verkauf von Büchern","hu":"könyvkereskedelem"},{"de":"der Vertrieb","definition":"die Organisation des Verkaufs","hu":"értékesítés, forgalmazás"},{"de":"die Druckkosten (Pl.)","definition":"das Geld für das Drucken","hu":"nyomdaköltségek"},{"de":"die Einnahmen (Pl.)","definition":"das Geld, das durch Verkäufe hereinkommt","hu":"bevételek"},{"de":"die Herausforderung","definition":"eine schwierige Aufgabe","hu":"kihívás"},{"de":"die Wertschöpfung","definition":"die Schaffung wirtschaftlichen Werts","hu":"értékteremtés"}],"sentences":["Die Digitalisierung stellt den traditionellen Buchhandel vor neue Herausforderungen.","Auch digitale Bücher verursachen Kosten für Redaktion, Gestaltung und Vertrieb.","Für Verlage eröffnen sich neue Vertriebswege."],"questions":[{"q":"Welche Folgen haben E-Books für Buchhandlungen?","a":"E-Books können den Wettbewerb verändern, weil viele Kunden online einkaufen. Gleichzeitig können Buchhandlungen mit Beratung und besonderen Angeboten punkten."},{"q":"Warum sind E-Books nicht automatisch kostenlos?","a":"Auch ohne Druckkosten müssen Autoren, Lektoren und Verlage bezahlt werden. Dazu kommen Kosten für Technik, Gestaltung und Vertrieb."},{"q":"Wie können Buchhandlungen auf die Digitalisierung reagieren?","a":"Buchhandlungen können neben gedruckten Büchern auch digitale Angebote anbieten und Kunden persönlich beraten. Veranstaltungen und Lesungen können ebenfalls helfen, sich von großen Onlineplattformen abzuheben."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":12,"title":"Deutschlandbezug","hu":"Németországi vonatkozás","text":"In Deutschland gilt die Buchpreisbindung grundsätzlich auch für E-Books. Sie soll unter anderem ein vielfältiges Buchangebot unterstützen. Viele öffentliche Bibliotheken bieten mit der Onleihe digitale Medien zum zeitlich begrenzten Ausleihen an. Gleichzeitig diskutieren Verlage, Bibliotheken und Leser über faire Zugangsbedingungen und Urheberrechte. Für genaue Marktzahlen sollte man aktuelle Quellen wie den Börsenverein des Deutschen Buchhandels nutzen.","summary":"Németország: kötött könyvár, Onleihe, könyvpiac és szerzői jogok.","vocab":[{"de":"die Buchpreisbindung","definition":"die gesetzliche Bindung bestimmter Buchverkaufspreise","hu":"kötött könyvár"},{"de":"die Onleihe","definition":"ein digitales Ausleihangebot von Bibliotheken","hu":"digitális könyvtári kölcsönzés"},{"de":"die öffentliche Bibliothek","definition":"eine Bibliothek für die Allgemeinheit","hu":"közkönyvtár"},{"de":"zeitlich begrenzt","definition":"nur für eine bestimmte Zeit","hu":"időben korlátozott"},{"de":"die Lesekultur","definition":"Gewohnheiten und Bedeutung des Lesens","hu":"olvasáskultúra"},{"de":"die Zugangsbedingung","definition":"eine Regel für die Nutzung eines Angebots","hu":"hozzáférési feltétel"},{"de":"die Branchenstatistik","definition":"Zahlen über einen Wirtschaftszweig","hu":"ágazati statisztika"}],"sentences":["In Deutschland gilt die Buchpreisbindung grundsätzlich auch für E-Books.","Über die Onleihe können Bibliotheksnutzer digitale Medien ausleihen.","Für aktuelle Zahlen zum deutschen Buchmarkt sollte man zuverlässige Quellen prüfen."],"questions":[{"q":"Was versteht man in Deutschland unter der Onleihe?","a":"Die Onleihe ist ein digitales Angebot vieler Bibliotheken in Deutschland. Nutzer können dort E-Books und andere digitale Medien für eine bestimmte Zeit ausleihen. Das erleichtert den Zugang zu Literatur."},{"q":"Was bedeutet Buchpreisbindung und warum ist sie wichtig?","a":"In Deutschland gelten für viele Bücher, auch für zahlreiche E-Books, feste Verkaufspreise. Das soll unter anderem einen vielfältigen Buchmarkt unterstützen. Deshalb kostet derselbe Titel bei verschiedenen Händlern normalerweise gleich viel."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]},{"id":13,"title":"Zukunft des Lesens","hu":"Az olvasás jövője","text":"Es ist schwer vorherzusagen, wie Menschen in Zukunft lesen werden. Wahrscheinlich werden digitale Angebote weiterentwickelt und neue Funktionen entstehen. Gedruckte Bücher werden vermutlich trotzdem nicht vollständig verschwinden, weil viele Leser sie schätzen. Denkbar ist, dass Menschen je nach Situation zwischen Papier, E-Book und Hörbuch wechseln. Wichtig ist vor allem, dass das Lesen attraktiv bleibt.","summary":"A jövő valószínűleg többféle olvasási formát hoz, nem feltétlenül teljes helyettesítést.","vocab":[{"de":"vorhersagen","definition":"sagen, was später passieren wird","hu":"előre jelezni"},{"de":"die Entwicklung","definition":"die Veränderung über die Zeit","hu":"fejlődés"},{"de":"vermutlich","definition":"wahrscheinlich","hu":"feltehetően"},{"de":"verschwinden","definition":"nicht mehr existieren","hu":"eltűnni"},{"de":"das Hörbuch","definition":"ein gesprochenes Buch zum Anhören","hu":"hangoskönyv"},{"de":"die Kombination","definition":"das Zusammenwirken mehrerer Dinge","hu":"kombináció"},{"de":"die Zukunftsperspektive","definition":"eine mögliche Entwicklung in der Zukunft","hu":"jövőkép"}],"sentences":["Meiner Meinung nach werden E-Books gedruckte Bücher nicht vollständig ersetzen.","Vermutlich werden verschiedene Leseformen auch in Zukunft nebeneinander bestehen.","Entscheidend ist nicht nur das Medium, sondern auch die Freude am Lesen."],"questions":[{"q":"Werden gedruckte Bücher verschwinden?","a":"Das glaube ich nicht. Digitale Bücher werden zwar wichtiger, aber viele Menschen schätzen weiterhin das Leseerlebnis mit Papier."},{"q":"Wie könnte das Lesen in Zukunft aussehen?","a":"Ich kann mir vorstellen, dass Menschen je nach Situation E-Books, gedruckte Bücher oder Hörbücher nutzen. Neue Technologien könnten das Angebot erweitern."}],"c1":["einen Aspekt differenziert betrachten (egy szempontot árnyaltan vizsgálni)","Entscheidend ist, in welchem Zusammenhang man das Medium nutzt. (Az a döntő, milyen összefüggésben használjuk a médiumot.)"]}],"extra":[{"de":"ein Buch erwerben","definition":"ein Buch kaufen","hu":"könyvet megvásárolni"},{"de":"auf Inhalte zugreifen","definition":"Inhalte nutzen oder öffnen können","hu":"tartalmakhoz hozzáférni"},{"de":"die Suchfunktion nutzen","definition":"im Text nach Wörtern suchen","hu":"keresőfunkciót használni"},{"de":"eine Datei übertragen","definition":"eine Datei auf ein anderes Gerät bringen","hu":"fájlt átmásolni"},{"de":"die Leseposition speichern","definition":"merken, wo man aufgehört hat","hu":"olvasási pozíciót menteni"},{"de":"die Schriftart auswählen","definition":"eine bestimmte Form der Buchstaben wählen","hu":"betűtípust kiválasztani"},{"de":"die Hintergrundbeleuchtung","definition":"das Licht im Lesegerät","hu":"háttérvilágítás"},{"de":"der Speicherplatz","definition":"der Platz für digitale Dateien","hu":"tárhely"},{"de":"die Speicherkapazität","definition":"die Menge an Daten, die ein Gerät speichern kann","hu":"tárolókapacitás"},{"de":"die Internetverbindung","definition":"die Verbindung zum Internet","hu":"internetkapcsolat"},{"de":"die Benutzerfreundlichkeit","definition":"wie einfach ein Gerät zu benutzen ist","hu":"felhasználóbarát kialakítás"},{"de":"barrierefrei","definition":"auch für Menschen mit Einschränkungen gut nutzbar","hu":"akadálymentes"},{"de":"die Vorlesefunktion","definition":"eine Funktion, die Text laut wiedergibt","hu":"felolvasó funkció"},{"de":"das Wörterbuch integrieren","definition":"ein Wörterbuch in ein Gerät einbauen","hu":"szótárt beépíteni"},{"de":"die Lizenz","definition":"eine Erlaubnis zur Nutzung","hu":"felhasználási engedély"},{"de":"die Nutzungsrechte (Pl.)","definition":"Rechte zur Verwendung eines Werks","hu":"felhasználási jogok"},{"de":"die Raubkopie","definition":"eine unerlaubte Kopie","hu":"kalózmásolat"},{"de":"das Abo kündigen","definition":"ein Abonnement beenden","hu":"előfizetést lemondani"},{"de":"die Ermäßigung","definition":"ein niedrigerer Preis","hu":"kedvezmény"},{"de":"der Bestseller","definition":"ein besonders oft verkauftes Buch","hu":"sikerlista-vezető könyv"},{"de":"die Neuerscheinung","definition":"ein neu veröffentlichtes Buch","hu":"új megjelenés"},{"de":"der Roman","definition":"ein längeres erzählendes Buch","hu":"regény"},{"de":"das Sachbuch","definition":"ein Buch mit Informationen zu einem Thema","hu":"ismeretterjesztő könyv"},{"de":"die Biografie","definition":"die Lebensgeschichte einer Person","hu":"életrajz"},{"de":"der Krimi","definition":"ein Buch über ein Verbrechen","hu":"krimi"},{"de":"der Lesefluss","definition":"das ungestörte Weiterlesen","hu":"olvasás folyamatossága"},{"de":"die Lesemotivation","definition":"der Wunsch, zu lesen","hu":"olvasási motiváció"},{"de":"ein Argument entkräften","definition":"zeigen, warum ein Argument nicht überzeugt","hu":"érvet megcáfolni"},{"de":"einen Kompromiss finden","definition":"eine Lösung zwischen Positionen finden","hu":"kompromisszumot találni"},{"de":"eine Behauptung begründen","definition":"erklären, warum etwas gelten soll","hu":"állítást megindokolni"}],"redemittel":[{"type":"Einleitung","de":"Zuerst möchte ich erklären, was man unter E-Books versteht.","hu":"Először szeretném elmagyarázni, mit értünk e-könyv alatt."},{"type":"Reihenfolge","de":"Dann gehe ich auf die Kosten ein.","hu":"Ezután rátérek a költségekre."},{"type":"Reihenfolge","de":"Danach beschäftige ich mich mit den Lesegewohnheiten.","hu":"Majd az olvasási szokásokkal foglalkozom."},{"type":"Abschluss","de":"Zum Schluss möchte ich meine eigene Meinung äußern.","hu":"Végül szeretném kifejteni a saját véleményemet."},{"type":"Vorteil","de":"Ein großer Vorteil "hu":"e-könyvet letölteni","example":"Ich kann einen Roman direkt auf meinen Reader herunterladen."},{"de":"auf ein E-Book zugreifen","definition":"ein digitales Buch öffnen und nutzen können","hu":"hozzáférni egy e-könyvhöz","example":"Mit einer gültigen Lizenz kann ich auf das E-Book zugreifen."},{"de":"die Schriftgröße anpassen","definition":"die Buchstaben größer oder kleiner einstellen","hu":"betűméretet módosítani","example":"Ich passe die Schriftgröße an, damit ich bequemer lesen kann."},{"de":"eine Textstelle markieren","definition":"eine wichtige Passage farblich hervorheben","hu":"szövegrészt kijelölni","example":"Beim Lernen markiere ich wichtige Textstellen."},{"de":"ein Wort nachschlagen","definition":"die Bedeutung eines unbekannten Wortes suchen","hu":"szót kikeresni","example":"Unbekannte Wörter kann ich sofort nachschlagen."},{"de":"ein Lesezeichen setzen","definition":"eine Stelle zum späteren Weiterlesen speichern","hu":"könyvjelzőt elhelyezni","example":"Ich setze ein Lesezeichen und lese später weiter."},{"de":"den Lesefortschritt synchronisieren","definition":"den aktuellen Lesestand auf Geräten abgleichen","hu":"az olvasási előrehaladást szinkronizálni","example":"Ich kann meinen Lesefortschritt auf zwei Geräten synchronisieren."},{"de":"den Akku aufladen","definition":"einem Gerät wieder elektrische Energie geben","hu":"akkumulátort feltölteni","example":"Vor der Reise muss ich den Akku aufladen."},{"de":"die Lesegewohnheiten verändern","definition":"beeinflussen, wie und wann Menschen lesen","hu":"megváltoztatni az olvasási szokásokat","example":"Digitale Medien können unsere Lesegewohnheiten verändern."},{"de":"gedruckte Bücher bevorzugen","definition":"Papierbücher lieber lesen als digitale Bücher","hu":"a nyomtatott könyveket előnyben részesíteni","example":"Für längere Romane bevorzuge ich gedruckte Bücher."},{"de":"die Konzentration fördern","definition":"helfen, aufmerksam zu bleiben","hu":"elősegíteni a koncentrációt","example":"Ein ruhiger Leseplatz kann die Konzentration fördern."},{"de":"vom Lesen ablenken","definition":"die Aufmerksamkeit vom Text weglenken","hu":"elvonni a figyelmet az olvasásról","example":"Benachrichtigungen können mich vom Lesen ablenken."},{"de":"die Umwelt belasten","definition":"schädliche Folgen für die Umwelt verursachen","hu":"terhelni a környezetet","example":"Die Herstellung von Geräten kann die Umwelt belasten."},{"de":"Rohstoffe verbrauchen","definition":"natürliche Materialien bei der Herstellung nutzen","hu":"nyersanyagokat felhasználni","example":"Für elektronische Geräte muss man Rohstoffe verbrauchen."},{"de":"Elektroschrott vermeiden","definition":"weniger alte elektronische Geräte wegwerfen","hu":"csökkenteni az elektronikai hulladékot","example":"Wer seinen Reader lange nutzt, kann Elektroschrott vermeiden."},{"de":"die Umweltbilanz berücksichtigen","definition":"die Umweltfolgen eines Produkts in die Bewertung einbeziehen","hu":"figyelembe venni a környezeti mérleget","example":"Man sollte die gesamte Umweltbilanz berücksichtigen."},{"de":"sich auf Dauer lohnen","definition":"langfristig einen Nutzen bringen","hu":"hosszú távon megérni","example":"Für Vielleser kann sich die Anschaffung auf Dauer lohnen."},{"de":"die Anschaffungskosten decken","definition":"die Kosten eines Gerätekaufs ausgleichen","hu":"fedezni a beszerzési költségeket","example":"Preisvorteile bei Büchern können die Anschaffungskosten mit der Zeit decken."},{"de":"ein Abonnement abschließen","definition":"einen Vertrag für ein regelmäßiges Angebot beginnen","hu":"előfizetést kötni","example":"Man kann ein Abonnement für digitale Bücher abschließen."},{"de":"ein E-Book ausleihen","definition":"ein digitales Buch für eine begrenzte Zeit nutzen","hu":"e-könyvet kölcsönözni","example":"Über die Onleihe kann ich ein E-Book ausleihen."},{"de":"das Urheberrecht verletzen","definition":"ein geschütztes Werk unerlaubt nutzen oder verbreiten","hu":"megsérteni a szerzői jogot","example":"Illega options":["verändern","aufladen","speichern"]},{"prompt":"Im Vergleich zum Film lässt ein Roman oft mehr Raum für die eigene _____.","answer":"Fantasie","options":["Fantasie","Akkulaufzeit","Ausleihe"]}],"8":[{"prompt":"Bei der Herstellung elektronischer Geräte werden Rohstoffe _____.","answer":"verbraucht","options":["verbraucht","ausgeliehen","markiert"]},{"prompt":"Die Umweltbilanz hängt auch von der _____ des Geräts ab.","answer":"Nutzungsdauer","options":["Nutzungsdauer","Schriftgröße","Buchpreisbindung"]}],"9":[{"prompt":"Digitale Schulbücher können den Unterricht sinnvoll _____.","answer":"ergänzen","options":["ergänzen","verletzen","entsorgen"]},{"prompt":"Benachrichtigungen können Schüler vom Lernen _____.","answer":"ablenken","options":["ablenken","ausleihen","verfilmen"]}],"10":[{"prompt":"Regelmäßige Pausen können helfen, Beschwerden zu _____.","answer":"vermeiden","options":["vermeiden","verbreiten","ausleihen"]},{"prompt":"Eine angenehme Beleuchtung kann das Lesen _____.","answer":"erleichtern","options":["erleichtern","verletzen","verkaufen"]}],"11":[{"prompt":"Die Digitalisierung stellt kleine Buchhandlungen vor neue _____.","answer":"Herausforderungen","options":["Herausforderungen","Bildschirmauflösungen","Lesezeichen"]},{"prompt":"Verlage müssen die Rechte der Autoren _____.","answer":"beachten","options":["beachten","aufladen","ausleihen"]}],"12":[{"prompt":"In Deutschland gilt die Buchpreisbindung grundsätzlich auch für _____.","answer":"E-Books","options":["E-Books","Lesezeichen","Lesegeräte"]},{"prompt":"Über die Onleihe können Bibliotheksnutzer digitale Bücher _____.","answer":"ausleihen","options":["ausleihen","verfilmen","herstellen"]}],"13":[{"prompt":"Gedruckte und digitale Bücher können in Zukunft _____ bestehen.","answer":"nebeneinander","options":["nebeneinander","kostenpflichtig","herunterladen"]},{"prompt":"Ob gedruckte Bücher verschwinden, lässt sich nicht sicher _____.","answer":"vorhersagen","options":["vorhersagen","aufladen","markieren"]}]}};

function head(title,sub){return `<button class="btn secondary back" onclick="go('home')">⌂ Zur Startseite</button><h1>${esc(title)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}`}

function home(){return `<section class="hero"><div class="eyebrow">DSD II · Mündliche Kommunikation · B2/C1</div><h1>📚 E-Books Lernkurs</h1><p>Erweitere deinen Wortschatz, beantworte Prüfungsfragen und bereite dich Schritt für Schritt auf deinen Kurzvortrag vor.</p></section><div class="stage-label">Dein Lernweg</div><div class="pathline">1. Wortschatz & Fragen <span>→</span> 2. Themen vertiefen <span>→</span> 3. Cluster</div><div class="grid home-grid">${[['🧠','Wortschatztraining','Aktiver Wortschatz, Zuordnung und Wortverbindungen',"go('practice')"],['💬','Prüferfragen','Fragen mit passenden Ausdrücken und Musterantworten',"go('exam')"],['📖','Grundwissen','Was sind E-Books? Wie funktionieren sie?',"go('module',0)"],['🧩','Alle Themen','14 Aspekte: Texte, Wortschatz und Übungen',"go('topics')"],['✍️','Lückentexte','Prüfungsrelevante Sätze ergänzen',"go('quiz')"],['🗣️','Wortschatz-Lexikon','Aktiver und zusätzlicher Wortschatz mit Übersetzung',"go('vocab')"],['✨','Redemittel','Formulierungen für Argumentation und Vergleich',"go('redemittel')"],['🎤','Abschluss: Cluster','5 Minuten frei sprechen',"go('cluster')"]].map((x,i)=>`<button class="tile ${i===0?'featured':''} ${i===7?'last-stage':''}" onclick="${x[3]}"><span class="emoji">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div><section class="card warm"><h3>🔊 Lerne aktiv!</h3><p>Sprich neue Wörter und Beispielsätze <b>laut</b> aus. Antworte zuerst selbst, bevor du die Lösung öffnest. Wiederhole schwierige Ausdrücke und benutze sie in eigenen Sätzen.</p></section>`}
function topics(){return head('Alle Themen','Wähle einen Aspekt aus und beginne mit dem Lernen.')+`<div class="grid">${M.map((m,i)=>`<button class="tile" onclick="go('module',${i})"><span class="emoji">${saved.modules[i]?'✅':'📘'}</span><strong>${esc(m.title)}</strong><small>${m.vocab.length} Wörter · ${m.questions.length} Fragen</small></button>`).join('')}</div>`}
function modulePage(){let m=M[state.module],idx=state.module;return head(m.title,'Wissen · Wortschatz · Beispielsätze · Übungen · Sprechen')+`<div class="pillbar"><span class="tag">Thema ${idx+1}/${M.length}</span><span class="tag">B2 + C1</span></div><section class="card"><h2>📖 Wissen</h2><p class="lead">${esc(m.text)}</p><p class="small">🔊 Lies den Text laut. Erkläre den Inhalt anschließend in drei eigenen Sätzen.</p></section><section class="card"><h2>🗣️ Wichtige Wörter und Ausdrücke</h2><p class="small">Lies jeden Ausdruck laut. Erkläre ihn auf Deutsch und benutze ihn in einem eigenen Satz.</p><h3>⭐ Aktiver Wortschatz – diese Ausdrücke solltest du benutzen können</h3>${m.vocab.slice(0,ACTIVE_LIMIT).map(v=>`<div class="word"><strong>${esc(v.de)} <span class="inlinehu">(${esc(v.hu)})</span></strong><div class="def">${esc(v.definition)}</div></div>`).join('')}<h3>📚 Zusätzlicher Wortschatz – diese Ausdrücke solltest du verstehen</h3>${m.vocab.slice(ACTIVE_LIMIT).map(v=>`<div class="word"><strong>${esc(v.de)} <span class="inlinehu">(${esc(v.hu)})</span></strong><div class="def">${esc(v.definition)}</div></div>`).join('')}<div class="buttons">${btn('Wörter jetzt üben',"go('practice')",'soft')}</div></section><section class="card"><h2>✨ Nützliche Beispielsätze</h2><p class="small">Sprich die Sätze laut. Versuche danach, sie ohne Vorlage zu formulieren.</p>${m.sentences.map((t,i)=>`<div class="sentence"><span class="number">${i+1}.</span> ${esc(t)}</div>`).join('')}</section><section class="card"><h2>⭐ Für Fortgeschrittene: C1</h2>${m.c1.map(s=>`<div class="sentence">${esc(s)}</div>`).join('')}</section><section class="card"><h2>✍️ Lückentexte</h2><p>Ergänze wichtige Formulierungen für die mündliche Prüfung.</p>${btn('Sätze üben',`go('quiz',${idx})`,'soft')}</section><section class="card"><h2>💬 Fragen zum Thema</h2>${m.questions.map((q,i)=>questionHtml(q,`m${idx}q${i}`,m.title)).join('')}</section><section class="card"><h2>🎤 Sprich frei!</h2><p>Sprich 60–90 Sekunden über <strong>${esc(m.title)}</strong>. Nenne wichtige Aspekte, begründe deine Meinung und gib ein Beispiel.</p><p class="small">🔊 Sprich laut und verwende mindestens drei neue Ausdrücke.</p></section><section class="card"><label class="checkrow"><input type="checkbox" ${saved.modules[idx]?'checked':''} onchange="markModule(${idx},this.checked)"><span><b>Ich habe dieses Thema geübt.</b></span></label><div class="buttons">${idx>0?btn('← Voriges Thema',`go('module',${idx-1})`):''}${idx<M.length-1?btn('Nächstes Thema →',`go('module',${idx+1})`,'soft'):btn('Zum Cluster',"go('cluster')",'soft')}</div></section>`}
function markModule(i,v){saved.modules[i]=v;save()}
const topicExpressions={
 'Umwelt':['die Umweltbelastung (környezeti terhelés)','Rohstoffe verbrauchen (nyersanyagokat felhasználni)','Elektroschrott vermeiden (elektronikai hulladékot elkerülni)','auf die Nutzungsdauer ankommen (a használati időtől függeni)'],
 'Kosten':['die Anschaffungskosten (beszerzési költségek)','auf Dauer Geld sparen (hosszú távon pénzt megtakarítani)','sich finanziell lohnen (anyagilag megérni)','von den Lesegewohnheiten abhängen (az olvasási szokásoktól függeni)'],
 'Copyright':['das Urheberrecht schützen (védeni a szerzői jogot)','eine illegale Kopie verbreiten (illegális másolatot terjeszteni)','die Rechte der Autoren beachten (figyelembe venni a szerzők jogait)'],
 'Schule':['digitale Lernmaterialien einsetzen (digitális tananyagokat használni)','die Aufmerksamkeit fördern (elősegíteni a figyelmet)','vom Unterricht ablenken (elvonni a figyelmet az óráról)'],
 'Lesegewohnheiten':['gedruckte Bücher bevorzugen (a nyomtatott könyveket előnyben részesíteni)','sich an digitales Lesen gewöhnen (hozzászokni a digitális olvasáshoz)','das Leseverhalten beeinflussen (befolyásolni az olvasási szokásokat)'],
 'Buchhandel':['den stationären Buchhandel unterstützen (támogatni a hagyományos könyvkereskedelmet)','Bücher online erwerben (online könyveket vásárolni)','eine Herausforderung darstellen (kihívást jelenteni)'],
 'Technik':['die Schriftgröße anpassen (beállítani a betűméretet)','Textstellen markieren (szövegrészeket kijelölni)','ein Wort nachschlagen (kikeresni egy szót)'],
 'Angebot':['das Angebot erweitern (bővíteni a kínálatot)','auf einen Titel zugreifen (hozzáférni egy könyvcímhez)','ein E-Book ausleihen (e-könyvet kölcsönözni)'],
 'Literatur':['eine Buchverfilmung vergleichen (összehasonlítani egy filmadaptációt)','die Handlung verändern (megváltoztatni a cselekményt)','die Fantasie anregen (megmozgatni a fantáziát)'],
 'Gesundheit':['die Augen ermüden (elfárad a szem)','regelmäßige Pausen einlegen (rendszeres szüneteket tartani)','die Konzentration verbessern (javítani a koncentrációt)'],
 'Deutschland':['die Buchpreisbindung (kötött könyvár)','die Onleihe nutzen (digitális könyvtári kölcsönzést használni)','öffentliche Bibliotheken (közkönyvtárak)'],
 'Zukunft':['nebeneinander bestehen (egymás mellett létezni)','eine Entwicklung vorhersagen (előre jelezni egy fejlődést)','sich langfristig durchsetzen (hosszú távon elterjedni)']};
function questionExpressions(q,topic=''){let z=(topic+' '+q.q).toLowerCase();let k=z.match(/umwelt|nachhalt|rohstoff|energie|ökobilanz/)?'Umwelt':z.match(/kosten|preis|geld|günstig|abonnement/)?'Kosten':z.match(/copyright|urheber|illegal|kopier|datenschutz/)?'Copyright':z.match(/schule|unterricht|lernen|bildung/)?'Schule':z.match(/gewohnheit|leseverhalten|lesekultur|jugend/)?'Lesegewohnheiten':z.match(/buchhandel|verlag|wirtschaft|buchhandlung/)?'Buchhandel':z.match(/angebot|zugang|bibliothek|ausleihe|auswahl/)?'Angebot':z.match(/literatur|film|roman|verfilmung|handlung/)?'Literatur':z.match(/gesundheit|auge|konzentration|pausen/)?'Gesundheit':z.match(/deutschland|onleihe|buchpreisbindung/)?'Deutschland':z.match(/zukunft|verschwinden|entwickeln/)?'Zukunft':'Technik';let terms=[...topicExpressions[k]];let module=M.find(m=>m.title===topic);if(module)terms.push(...module.vocab.slice(0,3).map(v=>v.de+' ('+v.hu+')'));let unique=[...new Set(terms)].slice(0,7);return `<b>Wichtige Ausdrücke zur Frage:</b><ul>${unique.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Hilfreiche Formulierungen:</b> Meiner Meinung nach … · Ein wichtiger Grund dafür ist, dass … · Zum Beispiel … · Allerdings …</p>`}
function questionHtml(q,key,topic=''){return `<div class="qcard"><p><b>${esc(q.q)}</b></p><p class="small">🔊 Antworte zuerst laut. Begründe deine Meinung und nenne ein Beispiel.</p><button class="btn secondary wide" onclick="toggleAnswer('hint${key}',this)">Wichtige Ausdrücke zur Frage anzeigen</button><div id="answer-hint${key}" class="answer" hidden>${questionExpressions(q,topic)}</div><button class="btn secondary wide" onclick="toggleAnswer('${key}',this)">Musterantwort anzeigen</button><div id="answer-${key}" class="answer" hidden>${esc(q.a)}<p class="small">Sprich die Antwort mit deinen eigenen Worten nach.</p></div></div>`}
function toggleAnswer(k,button){let e=document.getElementById('answer-'+k);if(!e)return;e.hidden=!e.hidden;if(button){let isHint=k.startsWith('hint');button.textContent=(isHint?'Wichtige Ausdrücke zur Frage':'Musterantwort')+(e.hidden?' anzeigen':' ausblenden')}}
// Kernwortschatz pro Modul: Die ersten fünf zentralen Begriffe sind Pflicht.
// Alle weiteren Wörter bleiben zum Vertiefen verfügbar.
const ACTIVE_LIMIT=5;
const allWords=M.flatMap((m,i)=>m.vocab.map((v,j)=>({...v,topic:m.title,id:`${i}-${j}`,level:j<ACTIVE_LIMIT?'active':'extra'}))).concat(CONTENT.extra.map((v,j)=>({...v,topic:'Extra-Wortschatz',id:`extra-${j}`,level:'extra'})));
function visibleWords(){return allWords.filter(w=>(state.vocabLevel==='all'||w.level===state.vocabLevel)&&(state.vocabTopic==='all'||w.topic===state.vocabTopic)&&(!state.search||[w.de,w.definition,w.hu].join(' ').toLowerCase().includes(state.search.toLowerCase())))}
function levelButtons(){return `<div class="modebar" role="group" aria-label="Wortschatz auswählen"><button class="pill ${state.vocabLevel==='active'?'active':''}" onclick="setVocabLevel('active')">⭐ Aktiver Wortschatz</button><button class="pill ${state.vocabLevel==='extra'?'active':''}" onclick="setVocabLevel('extra')">📚 Zusätzlicher Wortschatz</button><button class="pill ${state.vocabLevel==='all'?'active':''}" onclick="setVocabLevel('all')">Alle Wörter</button></div>`}
function setVocabLevel(v){state.vocabLevel=v;render()}
function vocab(){let topics=['all',...M.map(m=>m.title),'Extra-Wortschatz'];let filtered=visibleWords();return head('Wortschatz-Zentrale','Lerne zuerst den aktiven Wortschatz. Die zusätzlichen Wörter helfen dir, das Thema zu vertiefen.')+`<section class="card"><h2>⭐ Aktiver Wortschatz</h2><p>Diese Wörter und Ausdrücke solltest du <b>selbstständig in Sätzen verwenden</b> können. Sprich sie laut aus.</p><h2>📚 Zusätzlicher Wortschatz</h2><p>Diese Wörter solltest du <b>verstehen und wiedererkennen</b>. Du kannst sie später aktiv üben.</p>${levelButtons()}<label for="vsearch"><b>Wort suchen</b></label><input class="search" id="vsearch" placeholder="Suchbegriff eingeben …" value="${esc(state.search)}" oninput="setSearch(this.value)"><div style="height:10px"></div><label for="topicfilter"><b>Thema wählen</b></label><select id="topicfilter" class="filter" onchange="setVocabTopic(this.value)">${topics.map(t=>`<option value="${esc(t)}" ${t===state.vocabTopic?'selected':''}>${t==='all'?'Alle Themen':esc(t)}</option>`).join('')}</select><p class="small" id="wordCount">${filtered.length} Wörter und Ausdrücke</p><div class="buttons"><button class="btn secondary" onclick="toggleVocabTranslation()">Bedeutungen ${state.showHu?'ausblenden':'anzeigen'}</button><button class="btn secondary" onclick="toggleVocabDefinition()">Erklärungen ${state.showDefinition?'ausblenden':'anzeigen'}</button></div></section><div id="vocabList">${vocabList(filtered)}</div>`}
function vocabList(arr){if(!arr.length)return '<div class="empty">Keine Treffer.</div>';return arr.map(v=>`<div class="word"><span class="tag">${v.level==='active'?'⭐ Aktiver Wortschatz':'📚 Zusätzlicher Wortschatz'}</span><strong>${esc(v.de)} ${state.showHu?`<span class="inlinehu">(${esc(v.hu)})</span>`:''}</strong><div class="def" ${state.showDefinition?'':'hidden'}>${esc(v.definition)}</div><button class="link" onclick="markWord('${v.id}',${saved.words[v.id]?'false':'true'})">${saved.words[v.id]?'✓ Gelernt':'○ Als gelernt markieren'}</button></div>`).join('')}
function setSearch(v){state.search=v;refreshVocabList()}
function setVocabTopic(v){state.vocabTopic=v;render()}
function refreshVocabList(){let a=visibleWords();document.getElementById('vocabList').innerHTML=vocabList(a);document.getElementById('wordCount').textContent=a.length+' Wörter und Ausdrücke'}
function toggleVocabTranslation(){state.showHu=!state.showHu;render();document.getElementById('vsearch')?.focus()}
function toggleVocabDefinition(){state.showDefinition=!state.showDefinition;render();document.getElementById('vsearch')?.focus()}
function markWord(id,v){saved.words[id]=v;save();refreshVocabList()}
// deterministic multiple choice per vocabulary item; each question is a short contextual definition gap.

const practiceState={mode:'match',index:0,selected:'',done:false,show:false};
const nounVerb=[
{noun:'ein E-Book',hu:'e-könyv',verb:'herunterladen',choices:['herunterladen','aufladen','entkräften'],sentence:'Ich kann ein E-Book direkt auf meinen Reader herunterladen.'},
{noun:'den Akku',hu:'akkumulátor',verb:'aufladen',choices:['verfilmen','aufladen','ausleihen'],sentence:'Vor einer Reise sollte ich den Akku aufladen.'},
{noun:'eine Textstelle',hu:'szövegrész',verb:'markieren',choices:['synchronisieren','markieren','kosten'],sentence:'Wichtige Textstellen kann ich markieren.'},
{noun:'ein Wort',hu:'szó',verb:'nachschlagen',choices:['nachschlagen','entsorgen','verfilmen'],sentence:'Ich kann unbekannte Wörter nachschlagen.'},
{noun:'die Schriftgröße',hu:'betűméret',verb:'anpassen',choices:['verbreiten','anpassen','ausleihen'],sentence:'Ich kann die Schriftgröße individuell anpassen.'},
{noun:'ein Lesezeichen',hu:'könyvjelző',verb:'setzen',choices:['verletzen','setzen','sparen'],sentence:'Ich kann ein digitales Lesezeichen setzen.'},
{noun:'die Lesegewohnheiten',hu:'olvasási szokások',verb:'verändern',choices:['aufladen','verändern','markieren'],sentence:'E-Books können die Lesegewohnheiten verändern.'},
{noun:'die Umwelt',hu:'környezet',verb:'belasten',choices:['belasten','synchronisieren','verfilmen'],sentence:'Die Herstellung elektronischer Geräte kann die Umwelt belasten.'},
{noun:'das Urheberrecht',hu:'szerzői jog',verb:'verletzen',choices:['ausleihen','verletzen','anpassen'],sentence:'Illegales Kopieren kann das Urheberrecht verletzen.'},
{noun:'Vor- und Nachteile',hu:'előnyök és hátrányok',verb:'abwägen',choices:['aufladen','markieren','abwägen'],sentence:'Man sollte die Vor- und Nachteile abwägen.'},
{noun:'ein Argument',hu:'érv',verb:'entkräften',choices:['entkräften','herunterladen','sortieren'],sentence:'Mit einem Beispiel kann ich ein Gegenargument entkräften.'},
{noun:'ein Abonnement',hu:'előfizetés',verb:'abschließen',choices:['abschließen','nachschlagen','verfilmen'],sentence:'Man kann ein E-Book-Abonnement abschließen.'}
];
function practiceItems(){if(practiceState.mode==='verbs')return nounVerb.map(x=>({prompt:`Welches Verb passt zu „${x.noun}“ (${x.hu})?`,options:x.choices,answer:x.verb,example:x.sentence,hu:x.hu}));if(practiceState.mode==='meaning')return CONTENT.collocations.map((x,i)=>({prompt:`Was bedeutet „${x.de}“?`,options:[x.hu,CONTENT.collocations[(i+7)%CONTENT.collocations.length].hu,CONTENT.collocations[(i+13)%CONTENT.collocations.length].hu],answer:x.hu,example:x.example,hu:x.definition}));return CONTENT.collocations.map((x,i)=>({prompt:`Welcher Ausdruck passt zu dieser Erklärung?\n${x.definition}`,options:[x.de,CONTENT.collocations[(i+8)%CONTENT.collocations.length].de,CONTENT.collocations[(i+17)%CONTENT.collocations.length].de],answer:x.de,example:x.example,hu:x.hu}));}
function practice(){let items=practiceItems(),i=practiceState.index%items.length,x=items[i];return head('Wortschatztraining','Wähle eine Antwort. Sprich den vollständigen Satz anschließend laut.')+`<div class="modebar"><button class="pill ${practiceState.mode==='match'?'active':''}" onclick="practiceMode('match')">Zuordnen</button><button class="pill ${practiceState.mode==='verbs'?'active':''}" onclick="practiceMode('verbs')">Nomen + Verb</button><button class="pill ${practiceState.mode==='meaning'?'active':''}" onclick="practiceMode('meaning')">Deutsch → Magyar</button></div><section class="card"><div class="eyebrow">Aufgabe ${i+1}/${items.length}</div><div class="progress"><div style="width:${(i+1)/items.length*100}%"></div></div><h2 class="practice-question">${esc(x.prompt)}</h2><p class="small">Tippe auf die passende Antwort.</p>${x.options.map(o=>`<button class="choice ${practiceState.selected===o?'selected':''} ${practiceState.done&&o===x.answer?'correct':''} ${practiceState.done&&practiceState.selected===o&&o!==x.answer?'wrong':''}" onclick="practiceSelectIndex(${x.options.indexOf(o)})">${esc(o)}</button>`).join('')}<div class="buttons"><button class="btn" onclick="practiceCheck()" ${!practiceState.selected?'disabled':''}>Überprüfen</button><button class="btn secondary" onclick="practiceSolution()">Lösung anzeigen</button></div>${practiceState.done?`<div class="feedback ${practiceState.selected===x.answer?'':'error'}"><b>${!practiceState.selected?'Lösung:':practiceState.selected===x.answer?'✓ Richtig!':'✕ Noch nicht richtig.'}</b><p><b>Richtige Antwort:</b> ${esc(x.answer)} (${esc(x.hu)})</p><p>${esc(x.example)}</p><p class="small">🔊 Lies den Satz laut und bilde einen eigenen Satz.</p></div>`:''}<div class="buttons"><button class="btn soft wide" onclick="practiceNext()">Nächste Aufgabe →</button></div></section><section class="card warm"><h3>❗ Merke dir die Wortverbindungen!</h3><p>Lerne nicht nur einzelne Wörter, sondern auch typische Verbindungen wie <b>eine Textstelle markieren</b> oder <b>das Urheberrecht verletzen</b>.</p></section>`}
function practiceMode(m){practiceState.mode=m;practiceState.index=0;practiceState.selected='';practiceState.done=false;render()}
function practiceSelectIndex(j){if(practiceState.done)return;practiceState.selected=practiceItems()[practiceState.index%practiceItems().length].options[j];render()}
function practiceCheck(){if(!practiceState.selected)return;practiceState.done=true;render()}
function practiceSolution(){practiceState.done=true;render()}
function practiceNext(){practiceState.index=(practiceState.index+1)%practiceItems().length;practiceState.selected='';practiceState.done=false;render()}

function quizSet(){let idx=state.module;let m=M[idx];return m.vocab.map((v,i)=>{let wrong=m.vocab.filter((x,j)=>j!==i).slice(0,4).map(x=>x.de);let options=[v.de,...wrong.slice(0,3)];let shift=(i*3+idx)%options.length;options=options.slice(shift).concat(options.slice(0,shift));return {prompt:`Was bedeutet: „${v.definition}“?`,hu:v.hu,answer:v.de,options,topic:m.title}})}
function quiz(){let m=M[state.module];let questions=clozeQuestions(m);let n=Math.min(state.quizIndex,questions.length-1),q=questions[n];return head('Lückentexte','Ergänze wichtige B2-Sätze, die du in der Prüfung verwenden kannst.')+`<div class="card"><label for="qtopic"><b>Thema wählen</b></label><select id="qtopic" class="filter" onchange="go('quiz',this.value)">${M.map((x,i)=>`<option value="${i}" ${i===state.module?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><section class="card"><div class="eyebrow">Satz ${n+1}/${questions.length}</div><div class="progress"><div style="width:${(n+1)/questions.length*100}%"></div></div><p class="lead"><b>${esc(q.masked)}</b></p><p class="small">Wähle den passenden Ausdruck.</p>${q.options.map((o,i)=>`<button class="choice ${state.quizSelected===o?'selected':''} ${state.quizDone&&o===q.word?'correct':''} ${state.quizDone&&state.quizSelected===o&&o!==q.word?'wrong':''}" onclick="selectQuizIndex(${i})">${esc(o)}</button>`).join('')}<div class="buttons"><button class="btn" onclick="checkQuiz()" ${!state.quizSelected?'disabled':''}>Überprüfen</button><button class="btn secondary" onclick="showQuizAnswer()">Lösung anzeigen</button></div>${state.quizDone?`<div class="feedback ${state.quizSelected===q.word?'':'error'}"><b>${!state.quizSelected?'Lösung:':state.quizSelected===q.word?'✓ Richtig!':'✕ Noch nicht richtig.'}</b><p><b>Richtige Lösung:</b> ${esc(q.word)}</p><p>${esc(q.sentence)}</p><p class="small">🔊 Lies den vollständigen Satz laut vor.</p></div>`:''}<div class="buttons">${n>0?btn('← Voriger Satz','prevQuiz()'):''}${btn(n===questions.length-1?'Noch einmal':'Nächster Satz →','nextQuiz()','soft')}</div></section>`}
function clozeQuestions(m){let idx=M.indexOf(m);return CONTENT.clozes[String(idx)].map(x=>({sentence:x.prompt.replace('_____',x.answer),masked:x.prompt,word:x.answer,options:x.options}))}
function selectQuizIndex(i){state.quizSelected=clozeQuestions(M[state.module])[state.quizIndex].options[i];state.quizDone=false;render()}
function checkQuiz(){if(!state.quizSelected)return;state.quizDone=true;render()}
function showQuizAnswer(){state.quizSelected='';state.quizDone=true;render()}
function nextQuiz(){let n=clozeQuestions(M[state.module]).length;state.quizIndex=(state.quizIndex+1)%n;state.quizSelected='';state.quizDone=false;render()}
function prevQuiz(){let n=clozeQuestions(M[state.module]).length;state.quizIndex=(state.quizIndex-1+n)%n;state.quizSelected='';state.quizDone=false;render()}
function exam(){let all=CONTENT.original.map(x=>({...x,topic:'E-Books'})).concat(M.flatMap(m=>m.questions.map(q=>({...q,topic:m.title}))));let q=all[state.examIndex%all.length];return head('Prüferfragen','Übe frei zu sprechen. Öffne die Hilfen erst nach deinem eigenen Versuch.')+`<section class="card"><div class="eyebrow">Frage ${state.examIndex+1}/${all.length} · ${esc(q.topic)}</div><h2>${esc(q.q)}</h2><p class="muted">Antworte laut. Begründe deine Meinung und nenne Beispiele.</p><div class="buttons">${btn(state.examHints?'Ausdrücke ausblenden':'Wichtige Ausdrücke zur Frage anzeigen','toggleHints()','secondary')}${btn(state.examAnswer?'Antwort ausblenden':'Musterantwort anzeigen','toggleExamAnswer()','soft')}</div>${state.examHints?`<div class="summary">${questionExpressions(q,q.topic)}</div>`:''}${state.examAnswer?`<div class="answer"><b>Mögliche Antwort:</b><p>${esc(q.a)}</p><p class="small">Formuliere die Antwort jetzt mit deinen eigenen Worten. Lies wichtige Sätze laut vor.</p></div>`:''}<div class="buttons">${btn('← Vorige Frage','examMove(-1)')}${btn('Nächste Frage →','examMove(1)','soft')}</div></section>`}
function toggleHints(){state.examHints=!state.examHints;render()}
function toggleExamAnswer(){state.examAnswer=!state.examAnswer;render()}
function examMove(d){let n=CONTENT.original.length+M.reduce((s,m)=>s+m.questions.length,0);state.examIndex=(state.examIndex+d+n)%n;state.examAnswer=false;state.examHints=false;render()}
function redemittel(){return head('Redemittel und wichtige Ausdrücke','Formuliere klar, begründe deine Meinung und reagiere auf Gegenargumente.')+`<section class="card"><p>Lies die Ausdrücke laut und bilde zu jedem Ausdruck einen eigenen Satz über E-Books.</p>${CONTENT.redemittel.map(x=>`<div class="word"><span class="tag">${esc(x.type)}</span><strong style="margin-top:9px">${esc(x.de)} <span class="inlinehu">(${esc(x.hu)})</span></strong></div>`).join('')}</section>`}
function cluster(){let points=['Kosten','Printmedien','Lesegewohnheiten','Copyright','Möglichkeiten','Angebot','Bezug zu Literatur und/oder Film','… eigener Aspekt'];return head('DSD II · MK Teil 1','Cluster – spontaner Kurzvortrag')+`<section class="card"><p>Bereite einen Kurzvortrag von <b>5 Minuten</b> vor. Wähle <b>mindestens drei Stichwörter</b>. Du hast <b>20 Minuten Vorbereitungszeit</b>.</p><h2 style="text-align:center;margin:24px 0">E-Books</h2><p>Wähle mindestens drei Stichwörter:</p>${points.map((p,i)=>`<label class="checkrow"><input type="checkbox" onchange="togglePoint(${i},this.checked)" ${state.chosen.includes(i)?'checked':''}><span>${esc(p)}</span></label>`).join('')}<div id="selectedCount" class="stat">${state.chosen.length} ausgewählt</div><div class="buttons">${btn('Redemittel üben',"go('redemittel')")}${btn('Prüferfragen üben',"go('exam')",'soft')}</div></section><section class="card"><h3>So kannst du deinen Vortrag aufbauen</h3><div class="sentence">Zuerst möchte ich auf … eingehen.<br>Dann spreche ich über …<br>Danach beschäftige ich mich mit …<br>Zum Schluss möchte ich meine eigene Meinung äußern.</div><p class="small">Lerne keine langen Texte auswendig. Verbinde die Stichwörter, begründe deine Meinung und nenne Beispiele.</p></section><section class="card"><h3>Fragen zum Weiterdenken</h3>${CONTENT.original.map((q,i)=>questionHtml(q,'orig'+i,'E-Books')).join('')}</section>`}
function togglePoint(i,checked){state.chosen=checked?[...new Set([...state.chosen,i])]:state.chosen.filter(x=>x!==i);document.getElementById('selectedCount').textContent=state.chosen.length+' ausgewählt'}
function plan(){let learned=Object.values(saved.words).filter(Boolean).length;return head('Mein Lernplan','Übe selbstständig und wiederhole regelmäßig.')+`<div class="card"><h2>Meine Fortschritte (haladásom)</h2><p>📚 ${Object.values(saved.modules).filter(Boolean).length}/${M.length} Themen gelernt (témák)</p><p>🗣️ ${learned}/${allWords.length} Wörter gelernt (szavak)</p><div class="progress"><div style="width:${Object.values(saved.modules).filter(Boolean).length/M.length*100}%"></div></div><p class="small">A haladás ezen a telefonon, ebben a böngészőben tárolódik. Másik eszközön nem jelenik meg automatikusan.</p></div><div class="card"><h2>Empfohlene Reihenfolge (ajánlott sorrend)</h2>${['Grundwissen lesen und verstehen (alapismeretek)','Jeden Tag zwei Themen bearbeiten (napi két témakör)','Wörter laut erklären und übersetzen (szókincs)','Lückentexte ohne Hilfe lösen (lyukas mondatok)','Prüferfragen laut beantworten (vizsgakérdések)','Cluster: drei Stichwörter verbinden (három szempont)','Kurzvortrag aufnehmen und anhören (beszéd felvétele)'].map((x,i)=>`<label class="checkrow"><input type="checkbox" ${saved['plan'+i]?'checked':''} onchange="markPlan(${i},this.checked)"><span>${esc(x)}</span></label>`).join('')}</div><div class="card"><h3>Tipps (tanácsok)</h3><p>Sprich laut. Lerne wichtige Ausdrücke, aber keine langen Texte auswendig. Nutze die Musterantworten erst nach deinem eigenen Versuch.</p><p class="small">Beszélj hangosan. Kifejezéseket tanulj, ne hosszú szövegeket magolj. A mintaválaszt csak saját próbálkozás után nyisd meg.</p></div>`}
function markPlan(i,v){saved['plan'+i]=v;save()}
function render(){const pages={home,topics,module:modulePage,vocab,practice,quiz,exam,redemittel,cluster,plan};app.innerHTML=(pages[state.page]||home)();document.title=(state.page==='home'?'E-Books Lernkurs':state.page+' | E-Books Lernkurs')+' – DSD II'}
document.getElementById('homeBtn').addEventListener('click',()=>go('home'));render();
</script></body></html>
